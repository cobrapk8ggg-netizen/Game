name: Import Testify
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-testify.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'cobrapk8ggg-netizen/Game'
    runs-on: ubuntu-latest
    steps:
      - name: Import the pinned upstream revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh auth setup-git
          git clone https://github.com/cobrapk8ggg-netizen/Game.git .
          git remote add upstream https://github.com/Kkkermit/Testify.git
          git fetch --no-tags upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach 3597d62c5d8faf93e557f504bcd610864499b92b
          git merge --allow-unrelated-histories --strategy=ours --no-edit origin/main
          git push origin HEAD:main
